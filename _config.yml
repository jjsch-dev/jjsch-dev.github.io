title: "Firmware + AI"
description: "A case study series on building embedded systems with LLM assistance, validated by oscilloscopes and bench evidence."
author: "Juan José Schlögel"
url: "https://jjsch-dev.github.io"
baseurl: ""
theme: jekyll-theme-minimal
plugins:
  - jekyll-feed
  - jekyll-seo-tag

markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:title/

# SEO / Open Graph
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Social links (optional)
github_username: jjsch-dev
